[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --cov=backend --cov-report=term-missing:skip-covered
markers =
    backend: backend API or service tests.
    contract: externally observable request and response contract tests.
    integration: tests that exercise multiple application components together.
    unit: tests for one isolated unit of behavior.
