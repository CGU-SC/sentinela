[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --cov=backend --cov-report=term-missing:skip-covered
markers =
    backend: tests that exercise the Python backend layer; this is an additional layer marker.
    contract: HTTP boundary tests for public routes, request parameters, status codes, and response schemas.
    integration: tests that exercise multiple application components or a real local HTTP and persistence flow.
    unit: isolated domain, service, cache, or utility behavior with external boundaries controlled.
